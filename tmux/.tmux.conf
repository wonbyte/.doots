# vim: set ft=tmux tw=0 nowrap:

#------------------------------------
# General Settings
#------------------------------------

# Numbering starts at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Faster key repetition
set -s escape-time 0

# Scrollback history
set -g history-limit 100000

# TrueColor + undercurl. usstyle is tmux's built-in declaration that the
# outer terminal supports underscore styles and colours (curly underline
# for spell check and diagnostics) -- it replaces the old hand-written
# Smulx/Setulc terminal-overrides, which are deleted. Windows Terminal
# renders these correctly (verified by running nvim outside tmux).
# NOTE: terminal-features and terminal-overrides are applied at SERVER
# START only. prefix+r does NOT reapply them -- after editing this
# block, run: tmux kill-server
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB:clipboard:usstyle'

# OSC52 clipboard + passthrough
set -s set-clipboard on
set -g allow-passthrough on

# Focus events allow programs like Vim to know when they gain/lose focus
set-option -g focus-events on

# Enable mouse support for pane resizing, window switching, etc.
set -g mouse on

#------------------------------------
# Key Bindings
#------------------------------------

# Unbind default prefix and use C-a instead of C-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# New window in current pane's path
bind c new-window -c "#{pane_current_path}"

# Faster pane splitting using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Quickly switch sessions with a custom sessionizer script
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Pane navigation with hjkl instead of arrow keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi copy/paste mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Smoother scroll in copy-mode
bind -T copy-mode-vi WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi WheelDownPane send-keys -X halfpage-down

#------------------------------------
# Appearance Settings (melange dark)
#------------------------------------
# All hex values from melange-nvim's melange_dark.json:
#   #292522 bg      #34302C float   #403A36 sel
#   #867462 ui      #C1A78E com     #ECE1D7 fg
#   #EBC06D bright yellow           #E49B5D normal yellow
# The powerline arrows below are literal U+E0B0 / U+E0B2 glyphs. This file
# was generated programmatically so they are guaranteed present; verify
# after any copy or checkout with:
#   grep -cP '\x{e0b0}|\x{e0b2}' ~/.tmux.conf   # expect 5
set -g status-style none,bg=#292522
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
setw -g window-status-style none,fg=#C1A78E,bg=#292522
setw -g window-status-current-style none,fg=#292522,bg=#EBC06D
setw -g window-status-separator ""
setw -g window-status-activity-style none
set -g pane-border-style fg=#403A36
set -g pane-active-border-style fg=#E49B5D
set -g message-style fg=#C1A78E,bg=#403A36
set -g message-command-style fg=#C1A78E,bg=#403A36
set -g display-panes-colour "#403A36"
set -g display-panes-active-colour "#867462"
setw -g clock-mode-colour "#C1A78E"
set -g status-left '#[fg=#292522,bg=#C1A78E,bold] #S #[fg=#C1A78E,bg=#292522,nobold,nounderscore,noitalics]'
set -g status-right '#[fg=#403A36,bg=#292522,nobold,nounderscore,noitalics]#[fg=#C1A78E,bg=#403A36] %Y-%m-%d  %H:%M #[fg=#867462,bg=#403A36,nobold,nounderscore,noitalics]#[fg=#292522,bg=#867462,bold] #h '
setw -g window-status-current-format '#[fg=#292522,bg=#EBC06D,nobold,nounderscore,noitalics]#[fg=#292522,bg=#EBC06D] #I #[fg=#292522,bg=#EBC06D,bold] #W #[fg=#EBC06D,bg=#292522,nobold,nounderscore,noitalics]'
setw -g window-status-format '#[fg=#C1A78E,bg=#292522] #I #[fg=#C1A78E,bg=#292522] #W '
